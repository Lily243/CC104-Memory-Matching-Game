
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Matching Game</title>

    <link href="css/style.css" rel="stylesheet">
</head>

<body>

    <div class="game-container">

        <h1>Memory Matching Game</h1>

        <p class="instructions">
            Find and match all 6 pairs of identical cards!
        </p>

        <!-- GAME INFORMATION -->
        <div class="game-info">
            <p>Moves: <span id="moves">0</span></p>
            <p>Matches: <span id="matches">0/6</span></p>
        </div>

        <!-- 12 MEMORY CARDS -->
        <div class="card-grid" id="cardGrid">

            <div class="card">?</div>
            <div class="card">?</div>
            <div class="card">?</div>
            <div class="card">?</div>

            <div class="card">?</div>
            <div class="card">?</div>
            <div class="card">?</div>
            <div class="card">?</div>

            <div class="card">?</div>
            <div class="card">?</div>
            <div class="card">?</div>
            <div class="card">?</div>

        </div>

        <!-- RESTART BUTTON -->
        <button class="restart-btn" onclick="restartGame()">
            Restart Game
        </button>

    </div>

    <script src="js/game.js"></script>

</body>
</html>
